name: Grow Pokédex daily
on:
  schedule:
    - cron: '17 11 * * *' # 19:17 Asia/Taipei (UTC+8)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add next five missing species
        env:
          BATCH_SIZE: '5'
          MAX_POKEMON_ID: '1025'
        run: python scripts/update_pokedex.py
      - name: Commit verified metadata
        run: |
          if git diff --quiet -- data/pokemon.json; then echo 'No updates'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/pokemon.json
          git commit -m 'data: expand Pokédex from PokéAPI'
          git push
